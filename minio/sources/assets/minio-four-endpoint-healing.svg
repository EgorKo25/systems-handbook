<text x="20" y="1140" class="m07-label">Возможен nil у вызова, пока After(E3) остаётся Corrupt.</text>
<text x="20" y="1166">Результат читают отдельно по Endpoint. Следующая попытка может исправить E3.</text>
<text x="20" y="1192">Общая атомарная публикация всех целей этой сценой не предполагается.</text>
<text x="20" y="1220">h: 32 B · chunk: 512 KiB · 4 chunks на shard.</text>
<text x="20" y="1247">Один shard stream: 2 MiB payload + 128 B hashes.</text>
