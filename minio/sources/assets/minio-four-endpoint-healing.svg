<svg id="m07-storage-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1260" role="img" aria-labelledby="m07-fig-title m07-fig-desc">
<title id="m07-fig-title">GET вернул V; отдельный repair опубликовал только E4</title>
<desc id="m07-fig-desc">На узлах A и B лежат исправные data shards V.
Узел C содержит parity shard с плохим hash последнего chunk.
При GET reader E3 обнаружил повреждение, E4 был недоступен.
E1 и E2 дали клиенту все четыре MiB без записи новых parity.
Для отдельного repair E4 снова доступен с проверенным format слота.
Два временных parity parts записаны заново. Возвращённая ошибка Close
исключила E3; RenameData на E4 опубликовал его part и metadata.
E3 остаётся повреждённым. Это условная сцена, не native IO.</desc>
