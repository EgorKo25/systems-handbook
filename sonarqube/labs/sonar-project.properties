sonar.projectKey=handbook-service
sonar.projectName=Handbook Go service
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,reports/**,tools/**,vendor/**,.scannerwork/**,.sonar/**
sonar.go.coverage.reportPaths=reports/coverage.out
sonar.go.tests.reportPaths=reports/test.jsonl
# No token, host-specific URL, branch name, or invented quality result.
# go.mod stays inside source scope; tests have their own category.
