name: study-docker
services:
  echo:
    image: ${APP_IMAGE:?Select the built image in the technology passport}
    pull_policy: never
    environment:
      APP_ADDR: :8080
      APP_DATA_DIR: /data
      GOMEMLIMIT: 160MiB
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - counter:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/echo", "check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  counter:
    external: true
    name: study-data
