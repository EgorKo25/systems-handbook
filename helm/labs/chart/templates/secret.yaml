{{- if and .Values.credentials.create .Values.credentials.existingSecret -}}
{{- fail "credentials.create and existingSecret are mutually exclusive" -}}
{{- end -}}
{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger.secretName" . }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ required "credentials.token is required when create=true" .Values.credentials.token | b64enc | quote }}
{{- end }}
