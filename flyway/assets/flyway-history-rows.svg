<svg id="flyway-history-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" role="img" aria-labelledby="flyway-history-title flyway-history-desc" style="display:block;width:100%;max-width:420px;height:auto;margin:1em auto">
<title id="flyway-history-title">V2 добавляет одну строку history</title><desc id="flyway-history-desc">После V1 и repeatable уже есть ranks 1 и 2. Commit V2 добавляет rank 3; Pending V3–V6 существует лишь в сопоставлении файлов с этой таблицей.</desc>
<style>#flyway-history-drawing .paper{fill:var(--reader-paper,#fffdf7)}#flyway-history-drawing text{fill:var(--reader-text,#18252b);font:17px sans-serif}#flyway-history-drawing .small{font-size:15px}#flyway-history-drawing .mono{font-family:monospace;font-size:16px}#flyway-history-drawing .box{fill:var(--reader-bg,#f1f4f3);stroke:var(--reader-line,#68767c);stroke-width:1.5}#flyway-history-drawing .line{fill:none;stroke:var(--reader-text,#18252b);stroke-width:2}#flyway-history-drawing .bold{font-weight:bold}@media print{#flyway-history-svg{max-width:85mm!important}#flyway-history-drawing text{fill:#000}#flyway-history-drawing .box,#flyway-history-drawing .paper{fill:#fff;stroke:#000}#flyway-history-drawing .line{stroke:#000}}</style>
<g id="flyway-history-drawing"><rect class="paper" width="400" height="670"/>
<text x="20" y="30" class="bold">Ресурс V2 → SQL → commit</text>
<rect class="box" x="16" y="46" width="368" height="94" rx="6"/>
<text x="28" y="73" class="mono">V2__expand_title.sql</text><text x="28" y="99">CRC32: −143682903</text><text x="28" y="125" class="small">ADD title; body допускает NULL</text>
<path class="line" d="M200 145 V173 M193 165 L200 174 L207 165"/>
<text x="20" y="183" class="bold">flyway_meta.</text><text x="20" y="207" class="mono">flyway_schema_history</text>
<rect class="box" x="16" y="218" width="368" height="102" rx="6"/>
<text x="28" y="244">rank 1 · version 1 · SQL · true</text><text x="28" y="273" class="mono">V1__create_notes.sql</text><text x="28" y="303">checksum 1528097600</text>
<rect class="box" x="16" y="328" width="368" height="102" rx="6"/>
<text x="28" y="354">rank 2 · version NULL · SQL · true</text><text x="28" y="383" class="mono">R__note_count.sql</text><text x="28" y="413">checksum −1073421979</text>
<rect class="box" x="16" y="438" width="368" height="102" rx="6"/>
<text x="28" y="464" class="bold">+ rank 3 · version 2 · SQL · true</text><text x="28" y="493" class="mono">V2__expand_title.sql</text><text x="28" y="523">checksum −143682903</text>
<path class="line" d="M16 558 H384" stroke-dasharray="5 4"/>
<text x="20" y="586">info: V3–V6 Pending</text><text x="20" y="613" class="small">В history для них ещё нет строк.</text><text x="20" y="648" class="small">rank / version / type / success</text></g></svg>
