# No password. The wrapper supplies the private connection through environment.
# Paths are relative to the lab root, not the CLI installation.
flyway.locations=filesystem:migrations
flyway.schemas=flyway_meta,app
flyway.defaultSchema=flyway_meta
flyway.createSchemas=false
flyway.cleanDisabled=true
flyway.validateMigrationNaming=true
flyway.validateOnMigrate=true
flyway.baselineOnMigrate=false
flyway.outOfOrder=false
flyway.failOnMissingLocations=true
flyway.connectRetries=0
flyway.lockRetryCount=5
# Session advisory lock supports the separate nontransactional index migration.
flyway.postgresql.transactional.lock=false
