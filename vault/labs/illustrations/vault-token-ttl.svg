<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 690" role="img" aria-labelledby="vault-token-ttl-title vault-token-ttl-desc" style="display:block;width:100%;max-width:400px;height:auto;margin:auto">
<title id="vault-token-ttl-title">Продление оператора 8h с explicit max 24h</title><desc id="vault-token-ttl-desc">Показаны успешные renew в часы 6,12,18; абсолютные концы срока — часы 14,20,24. Без renew срок истечёт в час 8. Это арифметическая модель без более строгих лимитов.</desc>
<style>
#vault-token-ttl-art .paper{fill:var(--reader-paper,#fffcf5)}
#vault-token-ttl-art .soft{fill:var(--reader-soft,#e8f2ec)}
#vault-token-ttl-art text{fill:var(--reader-text,#202d34);font-family:Arial,sans-serif;font-size:20px}
#vault-token-ttl-art .head{font-size:23px;font-weight:bold}
#vault-token-ttl-art .line{fill:none;stroke:var(--reader-text,#202d34);stroke-width:1.5}
#vault-token-ttl-art .mark{fill:var(--reader-accent,#0c6b63)}
#vault-token-ttl-art .accent{fill:none;stroke:var(--reader-accent,#0c6b63);stroke-width:3}
@media print{#vault-token-ttl-art .paper,#vault-token-ttl-art .soft{fill:#fff} #vault-token-ttl-art text,#vault-token-ttl-art .mark{fill:#000} #vault-token-ttl-art .line,#vault-token-ttl-art .accent{stroke:#000}}
</style>
<g id="vault-token-ttl-art"><rect class="paper" width="400" height="690"/><text x="16" y="32" class="head">Renew не переносит max TTL</text><text x="16" y="66">Часы с момента выдачи оператора</text><path class="line" d="M36.0 83v12"/><text x="36.0" y="120">0</text><path class="line" d="M117.0 83v12"/><text x="109.0" y="120">6</text><path class="line" d="M198.0 83v12"/><text x="190.0" y="120">12</text><path class="line" d="M279.0 83v12"/><text x="271.0" y="120">18</text><path class="line" d="M360.0 83v12"/><text x="352.0" y="120">24</text><path class="accent" d="M36 89h324"/><path class="line" stroke-dasharray="5 5" d="M360 138v495"/><text x="16" y="165">Выдача: TTL 8h → до часа 8</text><rect class="soft" x="36.0" y="181" width="108.0" height="27"/><path class="accent" d="M36.0 195h108.0"/><text x="16" y="260">Час 6: renew 8h → до 14</text><rect class="soft" x="117.0" y="276" width="108.0" height="27"/><path class="accent" d="M117.0 290h108.0"/><text x="16" y="355">Час 12: renew 8h → до 20</text><rect class="soft" x="198.0" y="371" width="108.0" height="27"/><path class="accent" d="M198.0 385h108.0"/><text x="16" y="450">Час 18: renew 8h → только 6h</text><rect class="soft" x="279.0" y="466" width="81.0" height="27"/><path class="accent" d="M279.0 480h81.0"/><text x="16" y="548">Без renew срок закончится в час 8.</text><text x="16" y="581">С renew предел всё равно час 24.</text><text x="16" y="614">Сервер может дать срок короче.</text><path class="line" d="M16 634h368"/><text x="16" y="669">Revoke раньше → следующий API403.</text></g></svg>
