<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1290" viewBox="0 0 400 1290" class="dma-map" role="img" aria-labelledby="dma-map-title dma-map-desc" style="display:block;width:100%;height:auto">
<title id="dma-map-title">DMA READ: два адресных пути к входному буферу и пять фаз владения</title>
<desc id="dma-map-desc">Учебная М32-I/O1 с IOMMU: op READ, LBA 7, length 512, device 1, IOVA 4000..41FF преобразуется в PA 2000..21FF с правом записи RAM. Отдельный CPU Sv32 профиль использует VA 00402000 для PA 2000. После DMA вход содержит 2A 00 00 00 и 508 нулей, completion ещё нет. complete-read меняет owner на completed и публикует SUCCESS, 512 B; после observe CPU читает данные. Выход PA 2200..23FF READ не меняет. Descriptor — объект JavaScript без бинарного PA/OWN-бита; кольцо в RAM не задано.</desc>
<defs><marker id="dma-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" style="fill:var(--reader-accent,#0c6b63)"/></marker></defs>
<style>
svg.dma-map{background:var(--reader-paper,#fffcf5);color:var(--reader-text,#202d34)}
.dma-map text{font:20px system-ui,sans-serif;fill:var(--reader-text,#202d34)}
.dma-map .small{font-size:19px}.dma-map .heading{font-size:24px;font-weight:700}.dma-map .bold{font-weight:700}.dma-map .mono{font:20px ui-monospace,monospace}
.dma-map .line,.dma-map .spine{stroke:var(--reader-muted,#5a696e);stroke-width:1.5;fill:none}.dma-map .data,.dma-map .data-arrow{stroke:var(--reader-accent,#0c6b63);stroke-width:3;fill:none}.dma-map .data-arrow{marker-end:url(#dma-map-arrow)}
.dma-map .descriptor,.dma-map .memory{fill:var(--reader-paper,#fffcf5);stroke:var(--reader-muted,#5a696e);stroke-width:1.5}.dma-map .descriptor{stroke-dasharray:6 4}.dma-map .input,.dma-map .output{fill:var(--reader-soft,#e8f2ec);stroke:var(--reader-muted,#5a696e);stroke-width:1.5}.dma-map .output{stroke-dasharray:5 3}
@media print{svg.dma-map{background:#fff}.dma-map text{fill:#000}.dma-map .descriptor,.dma-map .memory,.dma-map .input,.dma-map .output{fill:#fff;stroke:#000}.dma-map .line,.dma-map .spine,.dma-map .data,.dma-map .data-arrow{stroke:#000}.dma-map #dma-map-arrow path{fill:#000!important}}
</style>
<text x="16" y="32" class="heading">DMA: адрес и владение</text><text x="16" y="62" class="small">М32-I/O1 · READ · IOMMU включён</text><rect x="16" y="84" width="368" height="174" class="descriptor"/><text x="28" y="114" class="bold">Описатель — объект модели</text><text x="28" y="145" class="mono">op=READ; lba=7; length=512</text><text x="28" y="176" class="mono">address=4000h; device=1</text><text x="28" y="207" class="small">owner: host → device → completed</text><text x="28" y="239" class="small">PA и бинарный OWN-бит не заданы</text><path d="M28 278L28 399" class="spine"/><text x="48" y="292" class="bold">1  CPU подготовил поля</text><text x="48" y="321" class="small">2  publish: видимость и передача</text><text x="48" y="350" class="small">    doorbell сообщает о задании</text><text x="48" y="382" class="small">    редактирование запрещено</text><path d="M16 412L384 412" class="line"/><text x="16" y="445" class="heading">Буфер: два адресных пути</text><text x="16" y="478" class="small">CPU Sv32: VA 00402000h → PA 2000h</text><text x="16" y="509" class="small">Устройство 1: IOVA 4000h → PA 2000h</text><text x="16" y="540" class="small">Проверка IOMMU: write, 512 B</text><text x="16" y="570" class="small">Данные → RAM; проверяется адрес</text><rect x="68" y="594" width="316" height="297" class="memory"/><text x="80" y="622" class="bold">Фрагмент RAM · всего 64 KiB</text><rect x="80" y="638" width="292" height="108" class="input"/><text x="91" y="666" class="mono">2000..21FFh · 512 B</text><text x="91" y="697" class="small">2A 00 00 00 + 508 нулей</text><text x="91" y="728" class="small">3  DMA: устройство пишет</text><rect x="80" y="758" width="292" height="116" class="output"/><text x="91" y="786" class="mono">2200..23FFh · 512 B</text><text x="91" y="817" class="small">READ сюда не пишет</text><text x="91" y="848" class="small">Позже SW: только первые 4 B</text><path d="M20 594L20 692" class="data"/><path d="M20 692L68 692" class="data-arrow"/><text x="16" y="925" class="bold">После DMA completion ещё нет</text><path d="M28 944L28 1184" class="spine"/><text x="48" y="971" class="mono">4  complete-read</text><text x="48" y="1002" class="small">    owner=completed; published=false</text><text x="48" y="1033" class="small">    SUCCESS, 512 B; IRQ pending</text><text x="48" y="1075" class="small">5  observe: CPU проверил результат</text><text x="48" y="1106" class="small">    Только затем LW читает 4 B</text><text x="48" y="1148" class="small">    Буфер сохраняют до конца DMA</text><text x="48" y="1179" class="small">    Timeout не останавливает DMA</text><path d="M16 1204L384 1204" class="line"/><text x="16" y="1236" class="small">Кольцо в модели не размещено в RAM.</text><text x="16" y="1267" class="small">Формат и PA кольца здесь не заданы.</text>
</svg>
