<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="824" viewBox="0 0 390 824" role="img" aria-labelledby="title desc"><title id="title">Полный сумматор из пяти логических вентилей</title><desc id="desc">A и B поданы на XOR и AND: P=A XOR B, G=A AND B. P и Cin поданы на второй XOR и AND: S=P XOR Cin, T=P AND Cin. OR объединяет G и T в Cout. На рисунке A=1, B=0, Cin=1: P=1, G=0, T=1, S=0, Cout=1. Точки соединяют провода; дуга означает пересечение без соединения. Показаны логические функции, не транзисторная топология XOR и не физические задержки.</desc><defs><marker id="flow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#243f50" /></marker>
<style>text{font:21px 'DejaVu Sans',sans-serif;fill:#172b38}.heading{font-size:23px;font-weight:bold}.small{font-size:19px}.code{font-family:'DejaVu Sans Mono',monospace}.panel{fill:#fff;stroke:#71808a;stroke-width:1.5}.wire{stroke:#243f50;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.on{stroke:#12644d;stroke-width:5;fill:none}.blocked{stroke:#7c3b25;stroke-width:2.5;fill:none}.open{stroke:#243f50;stroke-width:2.3;fill:#fff}.node{fill:#243f50}.flow{stroke:#243f50;stroke-width:2;stroke-dasharray:5 5;fill:none;marker-end:url(#flow)}.gate{fill:#edf3f5;stroke:#243f50;stroke-width:2.5}.carry{stroke:#744615;stroke-width:3.2;fill:none;stroke-linejoin:round}.quiet{fill:#edf3f5;stroke:none}</style></defs>
<rect width="390" height="824" fill="#f6f8f9" /><g transform="translate(0 -1062)"><rect x="12" y="1062" width="366" height="824" rx="12" class="panel" />
