<text x="27" y="640" class="small">P = A XOR B</text>
<text x="27" y="670" class="small">G = A AND B</text>
<text x="27" y="700" class="small">T = P AND Cin</text>
<text x="27" y="730" class="small">S = P XOR Cin</text>
</g>
</g></svg>