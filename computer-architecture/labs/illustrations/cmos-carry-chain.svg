<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="414" viewBox="0 0 390 414" role="img" aria-labelledby="title desc"><title id="title">Переносы при четырёхбитном сложении 7 плюс 1</title><desc id="desc">A=0111, B=0001. Расчёт идёт от младшего i=0 к старшему i=3. Строки A,B,Cin,S,Cout: 1,1,0,0,1; 1,0,1,0,1; 1,0,1,0,1; 0,0,1,1,0. Cout строки становится Cin следующей. C0=0, C1=C2=C3=1, C4=0. S3…S0=1000: без знака это 8, в четырёхбитном знаковом формате −8 с переполнением.</desc><defs><marker id="flow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#243f50" /></marker>
<style>text{font:21px 'DejaVu Sans',sans-serif;fill:#172b38}.heading{font-size:23px;font-weight:bold}.small{font-size:19px}.code{font-family:'DejaVu Sans Mono',monospace}.panel{fill:#fff;stroke:#71808a;stroke-width:1.5}.wire{stroke:#243f50;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.on{stroke:#12644d;stroke-width:5;fill:none}.blocked{stroke:#7c3b25;stroke-width:2.5;fill:none}.open{stroke:#243f50;stroke-width:2.3;fill:#fff}.node{fill:#243f50}.flow{stroke:#243f50;stroke-width:2;stroke-dasharray:5 5;fill:none;marker-end:url(#flow)}.gate{fill:#edf3f5;stroke:#243f50;stroke-width:2.5}.carry{stroke:#744615;stroke-width:3.2;fill:none;stroke-linejoin:round}.quiet{fill:#edf3f5;stroke:none}</style></defs>
<rect width="390" height="414" fill="#f6f8f9" /><g transform="translate(0 -1906)"><rect x="12" y="1906" width="366" height="349" rx="12" class="panel" />
<text x="25" y="1940" class="heading">Перенос: 7 + 1</text>
<text x="25" y="1971" class="code">A=0111; B=0001; C0=0</text>
<text x="25" y="2001" class="small">Строки: от младшего к старшему.</text>
<text x="28" y="2036" class="small">i</text>
<text x="96" y="2036" class="small">A</text>
<text x="132" y="2036" class="small">B</text>
<text x="169" y="2036" class="small">Cin</text>
<text x="236" y="2036" class="small">S</text>
<text x="288" y="2036" class="small">Cout</text>
<text x="28" y="2073" class="code">0</text>
<text x="96" y="2073" class="code">1</text>
<text x="132" y="2073" class="code">1</text>
<text x="178" y="2073" class="code">0</text>
<text x="236" y="2073" class="code">0</text>
<text x="305" y="2073" class="code">1</text>
<text x="28" y="2110" class="code">1</text>
<text x="96" y="2110" class="code">1</text>
<text x="132" y="2110" class="code">0</text>
<text x="178" y="2110" class="code">1</text>
<text x="236" y="2110" class="code">0</text>
<text x="305" y="2110" class="code">1</text>
<text x="28" y="2147" class="code">2</text>
<text x="96" y="2147" class="code">1</text>
<text x="132" y="2147" class="code">0</text>
<text x="178" y="2147" class="code">1</text>
<text x="236" y="2147" class="code">0</text>
<text x="305" y="2147" class="code">1</text>
<text x="28" y="2184" class="code">3</text>
<text x="96" y="2184" class="code">0</text>
<text x="132" y="2184" class="code">0</text>
<text x="178" y="2184" class="code">1</text>
<text x="236" y="2184" class="code">1</text>
<text x="305" y="2184" class="code">0</text>
<text x="25" y="2210" class="small">Cout → Cin следующей строки.</text>
<text x="25" y="2239" class="code">S3…S0 = 1000; C4 = 0</text>
<text x="20" y="2283" class="small">Без знака: 8. Со знаком: −8*</text>
<text x="20" y="2309" class="small">* Переполнение 4-битного формата.</text>
</g></svg>