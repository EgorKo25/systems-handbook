<figure id="pg11-commit-wal-timeline" aria-labelledby="pg11-wal-question" aria-describedby="pg11-wal-alternative">
<figcaption>
<h3 id="pg11-wal-question">До какой позиции WAL нужно дойти, чтобы подтвердить этот COMMIT?</h3>
<p>Возьмём две уже разобранные записи транзакции <code>xid=791</code>: вставку <code>(3, 'wal-visible')</code> в <code>book.pages</code> и её COMMIT. Байты и начальные LSN взяты из сохранённого примера PostgreSQL 18.6. Временная шкала ниже — выбранный допустимый порядок, а не измерение его длительности или момента сброса.</p>
</figcaption>
<p>Зададим <code>fsync=on</code>, <code>synchronous_commit=on</code> и отсутствие синхронного standby: <code>synchronous_standby_names=''</code>. Для рисунка выбран способ синхронизации <code>wal_sync_method=fdatasync</code>; это условие рисунка, а не установленное значение исходного опыта. Предполагаем, что ОС, контроллер и накопитель соблюдают запрос синхронизации. До показанной записи страницы в файл других изменений того же heap-блока нет.</p>
<p>Нужно различить начало записи и её конец. Поле <code>xl_tot_len</code> считает байты самой записи, включая 24-байтовый заголовок. «Конец записи» ниже — исключающая граница: адрес сразу после её последнего байта, то есть и после последнего байта её тела. Байты выравнивания в <code>xl_tot_len</code> не входят. В выбранной 64-битной сборке граница резервирования выравнивается на 8 байт. <code>XLogInsert</code> возвращает конец зарезервированного участка WAL, а не адрес начала и не обязательно простую сумму начала с <code>xl_tot_len</code>.</p>
<dl class="pg11-wal-records">
<dt>Heap INSERT, <code>xid=791</code></dt>
<dd>Начало: <code>0/01CB1438</code>.<br><code>xl_tot_len=194 B</code>: 24 B заголовка и 170 B после него.<br>Конец записи: <code>0/01CB14FA</code>.<br>Затем 6 B выравнивания; возвращённый конец <strong>I = <code>0/01CB1500</code></strong>.</dd>
<dt>Transaction COMMIT, <code>xid=791</code></dt>
<dd>Начало: <code>0/01CB1500</code>.<br><code>xl_tot_len=34 B</code>: 24 B заголовка и 10 B после него.<br>Конец записи: <code>0/01CB1522</code>.<br>Затем 6 B выравнивания; конец подтверждаемой транзакции <strong>C = <code>0/01CB1528</code></strong>.</dd>
</dl>
<p>В этом расчёте обе записи целиком помещаются в одну страницу WAL размером 8192 B: их начала находятся на смещениях 5176 и 5376, а конец C — на смещении 5416. Поэтому здесь достаточно округления: <code>194 + 6 + 34 + 6 = 240 B</code> от первого начала до C. При переходе через границу страницы WAL в физическом потоке появляются её заголовки; такое сложение нельзя автоматически переносить на произвольную запись. Концы I и C получены из принятой ветви исходного кода и арифметики, а не измерены отдельным вызовом функции наблюдения. <a href="https://github.com/postgres/postgres/blob/REL_18_6/src/backend/access/transam/xlog.c#L1089-L1146">Резервирование и возвращаемый EndPos в PostgreSQL 18.6</a>.</p>
<p>У heap-страницы есть поле <code>pd_lsn</code>: позиция WAL, соответствующая последнему изменению этой страницы. В показанном пути INSERT PostgreSQL передаёт результат <code>XLogInsert</code> в <code>PageSetLSN</code>. Поэтому для выбранного состояния после INSERT <code>pd_lsn=I</code>. COMMIT описывает исход транзакции и сам по себе не заменяет это поле на C. Сохранённый в исходном опыте <code>page-0.bin</code> снят раньше третьей вставки и содержит <code>pd_lsn=0/01CA84C8</code>; это не снимок страницы в нарисованном состоянии. <a href="https://github.com/postgres/postgres/blob/REL_18_6/src/backend/access/heap/heapam.c#L2248-L2253">Присвоение PageLSN в heap INSERT</a>.</p>
<p>Обозначим <strong>W</strong> границу уже записанного в файл WAL, а <strong>F</strong> — границу WAL, устойчиво сброшенного на носитель. Запись в файл может закончиться в кэше ОС: из <code>W ≥ C</code> ещё не следует <code>F ≥ C</code>. Слово <i>dirty</i> означает, что копия heap-страницы в общей памяти изменена и нуждается в записи; оно не означает неподтверждённую транзакцию. I, C, W и F — позиции одного потока WAL, а не адреса heap-файла.</p>
<svg data-plain-skip="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 954" role="img" aria-labelledby="pg11-svg-title pg11-svg-desc" class="pg11-wal-svg">
<title id="pg11-svg-title">COMMIT ждёт устойчивого WAL, а не записи heap-страницы</title>
<desc id="pg11-svg-desc">Условная последовательность для xid 791: INSERT резервирует WAL до I, COMMIT — до C. Запись WAL в файл ещё не означает устойчивость. После синхронизации F достигает C; сервер может подтвердить COMMIT, хотя heap-страница остаётся dirty. Её запись в файл показана позже. Шкала задаёт порядок, не длительность.</desc>

<p id="pg11-wal-alternative" class="pg11-wal-key"><strong>Текстовое чтение рисунка.</strong> INSERT меняет heap-блок 0 в общей памяти, создаёт 194-байтовую запись WAL и устанавливает PageLSN=I. COMMIT добавляет 34-байтовую запись до C. В выбранном промежуточном состоянии WAL уже записан до C, но ещё не сброшен до C: успешный ответ пока запрещён. Затем синхронизация делает WAL устойчивым до C. Сервер завершает действия подтверждения транзакции и может отправить успех клиенту. На этой ветви heap-страница всё ещё dirty и записывается в файл позже. Прямоугольники справа обозначают записи WAL; их высота не пропорциональна числу байтов. Длинная полоса слева обозначает время нахождения изменённой страницы в памяти, а не устройство страницы 8 KiB.</p>
<p>Для выбранного режима <code>XLogFlush(XactLastRecEnd)</code>, где <code>XactLastRecEnd=C</code>, должен завершиться до успешного ответа COMMIT. Условие локальной устойчивости — <strong><code>F ≥ C</code></strong>. Оно не означает, что клиент получает ответ в тот же миг: после сброса остаются действия со статусом транзакции, освобождением ресурсов и отправкой ответа. Отсутствие синхронного standby убирает ожидание такой реплики, но сохраняет локальное ожидание WAL. <a href="https://github.com/postgres/postgres/blob/REL_18_6/src/backend/access/transam/xact.c#L1498-L1508">Сброс WAL и подтверждение транзакции</a>, <a href="https://www.postgresql.org/docs/18/wal-async-commit.html">синхронное и асинхронное подтверждение</a>.</p>
<p>В выбранной ветви WAL сначала записывается, затем успешно завершается <code>fdatasync</code>, и PostgreSQL продвигает границу Flush. Устойчивость зависит от всей цепочки хранения, включая кэши устройства: рисунок не доказывает её испытанием с отключением питания. Если успешный ответ потеряется в сети, это не отменит уже подтверждённую транзакцию; клиент не сможет определить её исход по одному отсутствию ответа. <a href="https://github.com/postgres/postgres/blob/REL_18_6/src/backend/access/transam/xlog.c#L2424-L2556">Запись и продвижение Flush</a>, <a href="https://github.com/postgres/postgres/blob/REL_18_6/src/backend/access/transam/xlog.c#L8746-L8783">ветвь fdatasync</a>, <a href="https://www.postgresql.org/docs/18/wal-reliability.html">надёжность цепочки хранения</a>.</p>
<p>Запись heap-страницы в её файл требует своего порядка: сначала WAL должен быть устойчив хотя бы до PageLSN, то есть <strong><code>F ≥ I</code></strong>. Страница может уйти в файл и до COMMIT, если это условие уже выполнено; рисунок выбирает другую допустимую ветвь, где запись происходит позже. Завершение записи файла не тождественно его синхронизации с носителем. COMMIT не обязан ждать записи и синхронизации этой heap-страницы: после сбоя её изменение можно восстановить из устойчивого WAL. Именно к этому приводит следующий разбор <a href="#pg-11-redo">аварийного восстановления</a>. <a href="https://github.com/postgres/postgres/blob/REL_18_6/src/backend/storage/buffer/bufmgr.c#L4347-L4379">WAL перед записью постоянной страницы</a>, <a href="https://www.postgresql.org/docs/18/wal-intro.html">причина отложенной записи страниц</a>.</p>
