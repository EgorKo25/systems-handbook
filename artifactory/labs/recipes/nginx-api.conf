# UNEXECUTED personal-VM recipe for UI/API/Go/Generic only.
# Native OCI needs the vendor-generated routing described in chapter10.
server {
    listen 443 ssl;
    server_name aft.lab.example;
    ssl_certificate /etc/nginx/artifactory-tls/server.crt;
    ssl_certificate_key /etc/nginx/artifactory-tls/server.key;
    client_max_body_size 0;
    proxy_read_timeout 300s;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-JFrog-Override-Base-Url https://aft.lab.example;
        proxy_request_buffering off;
    }
}
