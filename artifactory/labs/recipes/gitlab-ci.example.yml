# UNEXECUTED recipe for one's own protected GitLab project and prepared runner.
# Pinned verified jf/go are provided by the runner image, not downloaded here.
stages: [release]
release_receipt:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG == "v1.0.0" && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - |
      set -eu
      set +x
      umask 077
      : "${JF_BIN:?prepared verified CLI required}"
      : "${GO_BIN:?prepared verified Go required}"
      : "${JF_TOKEN:?protected scoped token required}"
      : "${JF_USER:?token subject username required}"
      : "${JF_URL:?own accepted HTTPS platform required}"
      export PATH="$(dirname "$GO_BIN"):$PATH"
      export JFROG_CLI_HOME_DIR="$CI_PROJECT_DIR/.private-jf"
      export JFROG_CLI_TEMP_DIR="$CI_PROJECT_DIR/.private-jf-tmp"
      export JFROG_CLI_REPORT_USAGE=false JFROG_CLI_AVOID_NEW_VERSION_WARNING=true
      export GOENV=off GOWORK=off GOTOOLCHAIN=local
      export GOPRIVATE=example.invalid GONOPROXY=none GONOSUMDB=example.invalid
      mkdir -p dist "$JFROG_CLI_HOME_DIR/security/certs"
      # Install the previously approved PUBLIC CA from a protected file variable.
      cp "$JF_CA_FILE" "$JFROG_CLI_HOME_DIR/security/certs/lab.crt"
      export SSL_CERT_FILE="$JF_CA_FILE"
      printf '%s' "$JF_TOKEN" | "$JF_BIN" config add ci --url="$JF_URL" \
        --user="$JF_USER" --access-token-stdin --interactive=false
      "$JF_BIN" go-config --server-id-resolve=ci --repo-resolve=go-virtual \
        --server-id-deploy=ci --repo-deploy=go-local
      export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
      "$JF_BIN" go test ./... --no-fallback
      "$JF_BIN" go build -trimpath -ldflags='-X main.version=1.0.0' \
        -o dist/receipt-linux-amd64 ./cmd/receipt --no-fallback \
        --build-name=receipt --build-number="$CI_PIPELINE_ID"
      "$JF_BIN" rt upload dist/receipt-linux-amd64 \
        "generic-candidates/receipt/1.0.0/$CI_PIPELINE_ID/" --flat=true \
        --server-id=ci --fail-no-op=true --build-name=receipt --build-number="$CI_PIPELINE_ID"
      "$JF_BIN" rt build-publish receipt "$CI_PIPELINE_ID" --server-id=ci
  artifacts:
    paths: [dist/receipt-linux-amd64]
    expire_in: 1 day
  after_script:
    - 'test -n "$CI_PROJECT_DIR" && rm -rf -- "$CI_PROJECT_DIR/.private-jf" "$CI_PROJECT_DIR/.private-jf-tmp"'
