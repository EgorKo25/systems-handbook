rule_files:
  - alert-rules.yml
evaluation_interval: 1m
tests:
  - name: counter_reset_extrapolation_units
    interval: 1m
    input_series:
      - series: 'c_total{instance="a"}'
        values: '0 60 120 20 80 140'
      - series: 'c_total{instance="b"}'
        values: '0 60 120 180 240 300'
      - series: 'sparse_total'
        values: '_ _ 60 120'
      - series: 'zero_total'
        values: '_ 0 60 120'
    promql_expr_test:
      - expr: 'rate(c_total{instance="a"}[5m])'
        eval_time: 5m
        exp_samples:
          - labels: '{instance="a"}'
            value: 0.8333333333333334
      - expr: 'increase(c_total{instance="a"}[5m])'
        eval_time: 5m
        exp_samples:
          - labels: '{instance="a"}'
            value: 250
      - expr: 'irate(c_total{instance="a"}[5m])'
        eval_time: 5m
        exp_samples:
          - labels: '{instance="a"}'
            value: 1
      - expr: 'resets(c_total{instance="a"}[5m])'
        eval_time: 5m
        exp_samples:
          - labels: '{instance="a"}'
            value: 1
      - expr: 'rate(c_total{instance="a"}[30s])'
        eval_time: 5m
        exp_samples: []
      - expr: 'sum(rate(c_total[5m]))'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1.8333333333333335
      - expr: 'sum(increase(c_total[5m]))'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 550
      - expr: 'increase(sparse_total[3m])'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 90
      - expr: 'rate(sparse_total[3m])'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 0.5
      - expr: 'increase(zero_total[3m])'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 120
  - name: matchers_missing_and_staleness
    interval: 1m
    input_series:
      - series: 'q{job="api",zone="a"}'
        values: '10 10 10 10'
      - series: 'q{job="api",zone="b"}'
        values: '20 20 20 20'
      - series: 'q{job="worker"}'
        values: '30 30 30 30'
      - series: 'g'
        values: '10 20 30 stale'
    promql_expr_test:
      - expr: 'q{zone=""}'
        eval_time: 1m
        exp_samples:
          - labels: 'q{job="worker"}'
            value: 30
      - expr: 'count(q{zone!="b"})'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 2
      - expr: 'g'
        eval_time: 90s
        exp_samples:
          - labels: 'g'
            value: 20
      - expr: 'timestamp(g)'
        eval_time: 90s
        exp_samples:
          - labels: '{}'
            value: 60
      - expr: 'avg_over_time(g[2m])'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 25
      - expr: 'g'
        eval_time: 3m
        exp_samples: []
      - expr: 'count_over_time(g[3m])'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 2
      - expr: 'absent(g)'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'g offset 1m'
        eval_time: 2m
        exp_samples:
          - labels: 'g'
            value: 20
      - expr: 'g @ 60'
        eval_time: 3m
        exp_samples:
          - labels: 'g'
            value: 20
      - expr: 'max_over_time(g[2m:1m])'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 30
      - expr: 'absent_over_time(g[2m])'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1
  - name: arithmetic_comparison_matching
    interval: 1m
    input_series:
      - series: 'errors{job="api",instance="a",code="500"}'
        values: '2 2'
      - series: 'errors{job="api",instance="a",code="400"}'
        values: '1 1'
      - series: 'requests{job="api",instance="a"}'
        values: '10 10'
      - series: 'target_info{job="api",instance="a",team="blue"}'
        values: '1 1'
      - series: 'up{job="api",instance="a"}'
        values: '0 0'
      - series: 'up{job="api",instance="b"}'
        values: '1 1'
    promql_expr_test:
      - expr: 'errors / requests'
        eval_time: 1m
        exp_samples: []
      - expr: 'errors / on(job,instance) group_left requests'
        eval_time: 1m
        exp_samples:
          - labels: '{job="api",instance="a",code="500"}'
            value: 0.2
          - labels: '{job="api",instance="a",code="400"}'
            value: 0.1
      - expr: 'errors * on(job,instance) group_left(team) target_info'
        eval_time: 1m
        exp_samples:
          - labels: '{job="api",instance="a",code="500",team="blue"}'
            value: 2
          - labels: '{job="api",instance="a",code="400",team="blue"}'
            value: 1
      - expr: 'up == 0'
        eval_time: 1m
        exp_samples:
          - labels: 'up{job="api",instance="a"}'
            value: 0
      - expr: 'up == bool 0'
        eval_time: 1m
        exp_samples:
          - labels: '{job="api",instance="a"}'
            value: 1
          - labels: '{job="api",instance="b"}'
            value: 0
  - name: classic_and_native_histogram
    interval: 1m
    input_series:
      - series: 'h_bucket{le="0.1"}'
        values: '0 2'
      - series: 'h_bucket{le="0.3"}'
        values: '0 3'
      - series: 'h_bucket{le="1"}'
        values: '0 4'
      - series: 'h_bucket{le="+Inf"}'
        values: '0 4'
      - series: 'nh'
        values: '{{schema:0 count:4 sum:5 buckets:[1 3] offset:0}}'
    promql_expr_test:
      - expr: 'histogram_quantile(0.75, h_bucket)'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 0.3
      - expr: 'histogram_quantile(0.9, h_bucket)'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 0.72
      - expr: 'histogram_count(nh)'
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 4
      - expr: 'histogram_sum(nh)'
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 5
      - expr: 'histogram_avg(nh)'
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 1.25
      - expr: 'histogram_count(nh * 2)'
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 8
      - expr: 'histogram_count(nh / 2)'
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 2
      - expr: 'histogram_sum(nh + nh)'
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 10
      - expr: '2 / nh'
        eval_time: 0m
        exp_samples: []
      - expr: 'nh == bool nh'
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 1
  - name: pending_firing_keep_firing
    interval: 1m
    input_series:
      - series: 'up{job="fixture",instance="a"}'
        values: '1 0 0 0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: FixtureDown
        exp_alerts: []
      - eval_time: 3m
        alertname: FixtureDown
        exp_alerts:
          - exp_labels: {job: fixture, instance: a, severity: warning}
            exp_annotations: {summary: fixture down}
      - eval_time: 6m
        alertname: FixtureDown
        exp_alerts:
          - exp_labels: {job: fixture, instance: a, severity: warning}
            exp_annotations: {summary: fixture down}
      - eval_time: 7m
        alertname: FixtureDown
        exp_alerts: []
