groups:
  - name: go-lab
    interval: 15s
    rules:
      - record: job:lab_requests:rate5m
        expr: sum by (job) (rate(lab_requests_total[5m]))
      - record: job:lab_errors:rate5m
        expr: sum by (job) (rate(lab_requests_total{code="500"}[5m]))
      - record: job:lab_error_ratio:rate5m
        expr: job:lab_errors:rate5m / job:lab_requests:rate5m
      - alert: GoLabTargetDown
        expr: up{job="go-lab"} == 0
        for: 2m
        keep_firing_for: 1m
        labels:
          severity: warning
        annotations:
          summary: Go lab scrape is failing
      - alert: GoLabTargetMissing
        expr: absent_over_time(up{job="go-lab"}[2m])
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: No samples for the expected Go lab job
