apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-ingress
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: ledger-api
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          access: ledger
    ports:
    - protocol: TCP
      port: 8080
