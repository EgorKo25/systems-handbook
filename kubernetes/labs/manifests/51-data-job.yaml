apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-write-once
  namespace: lab
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: writer
        image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        command: [sh, -ec]
        args: ['test -e /data/record.txt || printf "ledger-v1\n" > /data/record.txt; cat /data/record.txt']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 100m, memory: 32Mi}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ledger-data
