# Optional VM profile. cp1 explicitly permits this one diagnostic Pod via toleration.
apiVersion: v1
kind: Pod
metadata:
  name: client-allowed
  namespace: lab
  labels:
    access: ledger
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: cp1
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: tools
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: [sleep, "3600"]
    resources:
      requests: {cpu: 10m, memory: 8Mi}
      limits: {cpu: 100m, memory: 32Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-denied
  namespace: lab
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: tools
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    command: [sleep, "3600"]
    resources:
      requests: {cpu: 10m, memory: 8Mi}
      limits: {cpu: 100m, memory: 32Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
