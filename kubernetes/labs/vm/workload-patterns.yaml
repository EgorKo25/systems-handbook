# Optional independent patterns; do not apply all on a small cluster.
# StatefulSet requires an available matching PV; Go does not write /data.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: ledger-rs
  namespace: lab
spec:
  selector:
    matchLabels:
      app: ledger-rs
  template:
    metadata:
      labels:
        app: ledger-rs
    spec:
      serviceAccountName: ledger-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ledger-api:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          failureThreshold: 3
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-peers
  namespace: lab
spec:
  clusterIP: None
  selector:
    app: ledger-member
  ports:
  - port: 8080
    targetPort: http
    name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-member
  namespace: lab
spec:
  selector:
    matchLabels:
      app: ledger-member
  template:
    metadata:
      labels:
        app: ledger-member
    spec:
      serviceAccountName: ledger-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ledger-api:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
  replicas: 1
  serviceName: ledger-peers
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: lab-local
      resources:
        requests:
          storage: 128Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ledger-agent
  namespace: lab
spec:
  selector:
    matchLabels:
      app: ledger-agent
  template:
    metadata:
      labels:
        app: ledger-agent
    spec:
      serviceAccountName: ledger-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: ledger-api:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ledger-check
  namespace: lab
spec:
  schedule: '*/5 * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: writer
            image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
            command:
            - sh
            - -ec
            args:
            - printf "scheduled handbook check\n"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 8Mi
              limits:
                cpu: 100m
                memory: 32Mi
