<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 850" width="390" height="850" role="img" aria-labelledby="mongodb-wire-title mongodb-wire-desc" class="mongodb-wire-svg">
<title id="mongodb-wire-title">Минимальный OP_MSG: все 51 байт</title>
<desc id="mongodb-wire-desc">Собственный пример ping:int32(1), $db:admin. Смещения от нуля, целые little-endian. Заголовок 16 B, flags 4 B, kind 1 B и BSON 30 B. Каждая строка показывает реальные байты своего интервала; это модель, не снятый пакет.</desc>
<style>.mongodb-wire-svg{color:var(--reader-text,#202d34);font-family:system-ui,sans-serif}.mongodb-wire-svg text{fill:currentColor;font-size:16px}.mongodb-wire-svg .title{font-size:20px;font-weight:700}.mongodb-wire-svg .hex{font-family:monospace;font-size:17px}.mongodb-wire-svg .paper{fill:var(--reader-paper,#fffcf5)}.mongodb-wire-svg .line{fill:none;stroke:currentColor;stroke-width:1}.mongodb-wire-svg .heavy{fill:none;stroke:currentColor;stroke-width:3}.mongodb-wire-svg .arrow{fill:none;stroke:currentColor;stroke-width:2;marker-end:url(#mongodb-wire-arrow)}</style>
<defs><marker id="mongodb-wire-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="currentColor"/></marker></defs>
<rect class="paper" width="390" height="850"/>
<text x="10" y="25" class="title">OP_MSG · 51 B</text>
<text x="10" y="50" class="">Слева — смещение байта, справа — поле.</text>
<text x="10" y="72" class="">Все целые LE; без TLS/сжатия/checksum.</text>
<path class="line" d="M63 90H380V682H63Z"/>
<text x="4" y="113" class="">0…3</text>
<text x="75" y="110" class="">messageLength = 51</text>
<text x="75" y="133" class="hex">33 00 00 00</text>
<path class="line" d="M63 142H380"/>
<text x="4" y="165" class="">4…7</text>
<text x="75" y="162" class="">requestID = 17</text>
<text x="75" y="185" class="hex">11 00 00 00</text>
<path class="line" d="M63 194H380"/>
<text x="4" y="217" class="">8…11</text>
<text x="75" y="214" class="">responseTo = 0</text>
<text x="75" y="237" class="hex">00 00 00 00</text>
<path class="line" d="M63 246H380"/>
<text x="4" y="269" class="">12…15</text>
<text x="75" y="266" class="">opCode = 2013</text>
<text x="75" y="289" class="hex">DD 07 00 00</text>
<path class="line" d="M63 298H380"/>
<text x="4" y="321" class="">16…19</text>
<text x="75" y="318" class="">flagBits = 0</text>
<text x="75" y="341" class="hex">00 00 00 00</text>
<path class="line" d="M63 350H380"/>
<text x="4" y="373" class="">20</text>
<text x="75" y="370" class="">kind = 0, тело команды</text>
<text x="75" y="393" class="hex">00</text>
<path class="line" d="M63 402H380"/>
<text x="4" y="425" class="">21…24</text>
<text x="75" y="422" class="">Длина BSON = 30</text>
<text x="75" y="445" class="hex">1E 00 00 00</text>
<path class="line" d="M63 454H380"/>
<text x="4" y="477" class="">25…34</text>
<text x="75" y="474" class="">ping: int32(1)</text>
<text x="75" y="497" class="hex">10 70 69 6E 67 00</text>
<text x="75" y="521" class="hex">01 00 00 00</text>
<path class="line" d="M63 530H380"/>
<text x="4" y="553" class="">35…49</text>
<text x="75" y="550" class="">$db: строка admin</text>
<text x="75" y="573" class="hex">02 24 64 62 00</text>
<text x="75" y="597" class="hex">06 00 00 00</text>
<text x="75" y="621" class="hex">61 64 6D 69 6E 00</text>
<path class="line" d="M63 630H380"/>
<text x="4" y="653" class="">50</text>
<text x="75" y="650" class="">Конец BSON</text>
<text x="75" y="673" class="hex">00</text>
<path class="line" d="M63 682H380"/>
<text x="10" y="714" class="title">16 + 4 + 1 + 30 = 51 B</text>
<text x="10" y="742" class="">Ответ модели: 38 B, requestID=90.</text>
<text x="10" y="768" class="">Его responseTo=17 ссылается на запрос.</text>
<text x="10" y="795" class="">Тело ответа {ok: double(1)} = 17 B.</text>
<text x="10" y="824" class="">Это не ID документа и не ID сессии.</text>
</svg>
