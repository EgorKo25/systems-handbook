<figcaption id="clru-question">Почему get(A) меняет будущую жертву, сохраняя значение?</figcaption>

<p>Развернём шаги 3–5 той же трассы в три снимка памяти. Список идёт от LRU (least recently used), узла с самым давним обращением, к MRU (most recently used), узлу последнего обращения. <code>head</code> указывает на начало LRU, <code>tail</code> — на конец MRU. Поле <code>prev</code> хранит адрес предыдущего узла, <code>next</code> — следующего. Знак <code>∅</code> означает нулевую ссылку. Рамка с точкой отмечает поле, изменившееся относительно предыдущего снимка.</p>
<p>Это самостоятельная учебная реализация той же политики. Адреса и размеры заданы для рисунка: три слота по 40 B, без TTL и параллельных читателей, удерживающих удалённую запись. Буква B после числа означает байты. В каждом слоте <code>key</code>, ячейка ключа, занимает 8 B; <code>value</code>, ячейка значения, — 16 B; под <code>prev</code> и <code>next</code> выделено по 8 B. Односимвольный ASCII-ключ занимает первый байт своей ячейки, семь остальных — резерв; ASCII кодирует используемые латинские буквы одним байтом. В value обозначения <code>a×16</code>, <code>b×16</code>, <code>c×16</code> и <code>d×16</code> означают шестнадцать повторений соответствующей однобайтовой ASCII-буквы; каждое значение занимает 16 B. Все адреса показаны в шестнадцатеричной записи; внутри ячеек префикс <code>0x</code> опущен.</p>
<p>Индекс имеет четыре корзины по одной 8-байтовой ссылке. Для этих четырёх односимвольных ключей зададим хеш равным ASCII-коду буквы: <code>65 mod 4=1</code> для A, затем корзины 2 для B, 3 для C и 0 для D. <code>mod</code> означает остаток от деления. Коллизий на A–D нет; это предпосылка примера, а не правило размещения произвольных ключей. Буквы возле корзин только поясняют ключ узла: их копий в 8-байтовой корзине нет.</p>

<p>При <code>get(A)</code> индекс даёт адрес <code>0x1000</code>; проверка ключа подтверждает A. Сам блок и его 16 байтов значения остаются на месте. Чтобы отсоединить A и добавить после C, меняются четыре поля узлов: <code>B.prev=∅</code>, <code>C.next=0x1000</code>, <code>A.prev=0x1050</code>, <code>A.next=∅</code>. Ещё две записи меняют <code>head=0x1028</code> и <code>tail=0x1000</code>. Корзины индекса не меняются: они находят те же узлы, хотя порядок теперь B C A.</p>
<p>Запрос D даёт промах в корзине 0. Загрузчик получил 16 байтов для нового значения; по условиям трассы оно принимается. Сначала удаляется LRU-узел B: корзина 2 очищается, C становится началом списка, слот <code>0x1028</code> доступен для повторного использования. Логическое освобождение не требует обнуления старых байтов. Затем в этот слот помещается D, корзина 0 получает его адрес, <code>A.next</code> указывает на D, <code>D.prev</code> — на A, а <code>D.next=∅</code>. Хвостом становится D. Адрес слота не изменился: теперь в нём запись D.</p>
<p>Пул узлов занимает <code>3×40=120 B</code>, индекс — <code>4×8=32 B</code>, head и tail — ещё 16 B. Всего зарезервировано <code>120+32+16=168 B</code>. При трёх живых записях это 48 B значений, 24 B ключевых ячеек и 96 B связей, индекса и двух крайних указателей. В ключевых ячейках полезны три байта букв; оставшиеся 21 B — резерв этих ячеек. После удаления B освобождается весь его 40-байтовый слот, а общие индекс и head/tail остаются выделенными.</p>

<p class="clru-legend">168 B относятся только к изображённым областям кэша. Внешний буфер загрузчика и память процесса сюда не входят; RSS из этого числа не вычисляется. Освобождённый слот остаётся в пуле. Это не устройство памяти Python OrderedDict или Redis и не измерение расхода реальной хеш-таблицы.</p>
