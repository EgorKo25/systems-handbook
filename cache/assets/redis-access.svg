<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Проверки доступа Redis</title><desc id="desc">Сертификат защищает соединение; AUTH выбирает пользователя; ACL проверяет команду и ключ. Обязательны проверки разрешённых и запрещённых действий.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Проверки доступа Redis</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Успех следующего уровня не заменяет проверку предыдущего</text><rect x="40" y="160" width="310" height="150" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="176" width="5" height="118" fill="#405fb1"/><text x="60" y="195" fill="#405fb1" font-size="23" font-weight="700">1. Сеть / TLS</text><text x="60" y="226" fill="#506879" font-size="18" font-weight="400">Достижим нужный сервер?</text><text x="60" y="253" fill="#506879" font-size="18" font-weight="400">Проверен сертификат?</text><rect x="395" y="160" width="310" height="150" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="395" y="176" width="5" height="118" fill="#087e80"/><text x="415" y="195" fill="#087e80" font-size="23" font-weight="700">2. AUTH</text><text x="415" y="226" fill="#506879" font-size="18" font-weight="400">Какой пользователь?</text><text x="415" y="253" fill="#506879" font-size="18" font-weight="400">Верный пароль?</text><rect x="750" y="160" width="310" height="150" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="750" y="176" width="5" height="118" fill="#b94343"/><text x="770" y="195" fill="#b94343" font-size="23" font-weight="700">3. ACL</text><text x="770" y="226" fill="#506879" font-size="18" font-weight="400">Разрешён GET?</text><text x="770" y="253" fill="#506879" font-size="18" font-weight="400">Разрешён ключ?</text><polyline points="350,235 395,235" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="705,235 750,235" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="80" y="420" width="430" height="130" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="80" y="436" width="5" height="98" fill="#087e80"/><text x="100" y="455" fill="#087e80" font-size="23" font-weight="700">book-reader</text><text x="100" y="486" fill="#506879" font-size="18" font-weight="400">GET book:product:42 → разрешён</text><rect x="585" y="420" width="430" height="130" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="585" y="436" width="5" height="98" fill="#b94343"/><text x="605" y="455" fill="#b94343" font-size="23" font-weight="700">Отрицательные проверки</text><text x="605" y="486" fill="#506879" font-size="18" font-weight="400">SET → NOPERM</text><text x="605" y="513" fill="#506879" font-size="18" font-weight="400">GET other:42 → NOPERM</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>