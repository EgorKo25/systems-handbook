<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Структуры ограниченного кэша</title><desc id="desc">Допуск, вытеснение, срок и размещение памяти выполняют разные функции. Политика вытеснения не знает бизнес-свежесть без отдельного протокола.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Структуры ограниченного кэша</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Поиск записи не решает автоматически свежесть и управление памятью</text><rect x="40" y="170" width="300" height="145" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="186" width="5" height="113" fill="#405fb1"/><text x="60" y="205" fill="#405fb1" font-size="23" font-weight="700">Хеш-таблица</text><text x="60" y="236" fill="#506879" font-size="18" font-weight="400">Ключ → запись</text><text x="60" y="263" fill="#506879" font-size="18" font-weight="400">Проверка равенства</text><rect x="400" y="170" width="300" height="145" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="400" y="186" width="5" height="113" fill="#087e80"/><text x="420" y="205" fill="#087e80" font-size="23" font-weight="700">Метаданные</text><text x="420" y="236" fill="#506879" font-size="18" font-weight="400">Срок / версия / размер</text><text x="420" y="263" fill="#506879" font-size="18" font-weight="400">История обращений</text><rect x="760" y="170" width="300" height="145" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="760" y="186" width="5" height="113" fill="#b94343"/><text x="780" y="205" fill="#b94343" font-size="23" font-weight="700">Значение</text><text x="780" y="236" fill="#506879" font-size="18" font-weight="400">Сериализованные байты</text><text x="780" y="263" fill="#506879" font-size="18" font-weight="400">Защита времени жизни</text><polyline points="340,242 400,242" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="700,242 760,242" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="40" y="420" width="300" height="135" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="436" width="5" height="103" fill="#405fb1"/><text x="60" y="455" fill="#405fb1" font-size="23" font-weight="700">Допуск</text><text x="60" y="486" fill="#506879" font-size="18" font-weight="400">Сохранять ли кандидата?</text><rect x="400" y="420" width="300" height="135" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="400" y="436" width="5" height="103" fill="#ac7919"/><text x="420" y="455" fill="#ac7919" font-size="23" font-weight="700">Вытеснение</text><text x="420" y="486" fill="#506879" font-size="18" font-weight="400">Какой объект удалить?</text><rect x="760" y="420" width="300" height="135" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="760" y="436" width="5" height="103" fill="#087e80"/><text x="780" y="455" fill="#087e80" font-size="23" font-weight="700">Аллокатор</text><text x="780" y="486" fill="#506879" font-size="18" font-weight="400">Где разместить блок?</text><polyline points="190,420 190,345 550,345 550,315" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="910,420 910,315" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>