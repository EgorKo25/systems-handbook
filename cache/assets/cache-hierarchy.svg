<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Два уровня кэша</title><desc id="desc">Пример использует условные доли попаданий. После L1 распределение запросов L2 меняется; его hit ratio нельзя брать из другого опыта.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Два уровня кэша</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Проценты второго уровня считаются только среди дошедших до него запросов</text><rect x="40" y="170" width="290" height="150" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="186" width="5" height="118" fill="#405fb1"/><text x="60" y="205" fill="#405fb1" font-size="23" font-weight="700">L1: процесс</text><text x="60" y="236" fill="#506879" font-size="18" font-weight="400">20 000 запросов/с</text><text x="60" y="263" fill="#506879" font-size="18" font-weight="400">h₁ = 80%</text><rect x="405" y="170" width="290" height="150" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="405" y="186" width="5" height="118" fill="#087e80"/><text x="425" y="205" fill="#087e80" font-size="23" font-weight="700">L2: общий кэш</text><text x="425" y="236" fill="#506879" font-size="18" font-weight="400">4 000 запросов/с</text><text x="425" y="263" fill="#506879" font-size="18" font-weight="400">h₂ = 90%</text><rect x="640" y="188" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="667" cy="193" r="2" fill="#087e80"/><rect x="640" y="203" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="667" cy="208" r="2" fill="#087e80"/><rect x="640" y="218" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="667" cy="223" r="2" fill="#087e80"/><rect x="770" y="170" width="290" height="150" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="770" y="186" width="5" height="118" fill="#ac7919"/><text x="790" y="205" fill="#ac7919" font-size="23" font-weight="700">Источник</text><text x="790" y="236" fill="#506879" font-size="18" font-weight="400">400 запросов/с</text><text x="790" y="263" fill="#506879" font-size="18" font-weight="400">2% исходного потока</text><rect x="1005" y="188" width="34" height="10" rx="3" fill="#ac7919" opacity=".20"/><circle cx="1032" cy="193" r="2" fill="#ac7919"/><rect x="1005" y="203" width="34" height="10" rx="3" fill="#ac7919" opacity=".20"/><circle cx="1032" cy="208" r="2" fill="#ac7919"/><rect x="1005" y="218" width="34" height="10" rx="3" fill="#ac7919" opacity=".20"/><circle cx="1032" cy="223" r="2" fill="#ac7919"/><polyline points="330,250 405,250" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="695,250 770,250" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="40" y="440" width="1020" height="115" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="40" y="456" width="5" height="83" fill="#b94343"/><text x="60" y="475" fill="#b94343" font-size="23" font-weight="700">Цена второго уровня</text><text x="60" y="506" fill="#506879" font-size="18" font-weight="400">Суммарная память L1 = память одного процесса × число процессов.</text><text x="60" y="533" fill="#506879" font-size="18" font-weight="400">Инвалидация должна учитывать оба уровня.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>