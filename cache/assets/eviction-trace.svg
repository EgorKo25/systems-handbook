<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">FIFO и LRU: разные жертвы</title><desc id="desc">Одно чтение A меняет будущую жертву LRU, но не FIFO. Алгоритмы сравниваются на одной последовательности и одной ёмкости.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">FIFO и LRU: разные жертвы</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Ёмкость 3 объекта; порядок на рисунке от старого к новому</text><text x="40" y="170" fill="#172f40" font-size="24" font-weight="700">После A B C</text><text x="390" y="170" fill="#172f40" font-size="24" font-weight="700">После попадания A</text><text x="760" y="170" fill="#172f40" font-size="24" font-weight="700">После запроса D</text><rect x="40" y="205" width="280" height="105" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="221" width="5" height="73" fill="#405fb1"/><text x="60" y="240" fill="#405fb1" font-size="23" font-weight="700">FIFO: A · B · C</text><rect x="390" y="205" width="280" height="105" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="390" y="221" width="5" height="73" fill="#405fb1"/><text x="410" y="240" fill="#405fb1" font-size="23" font-weight="700">FIFO: A · B · C</text><rect x="760" y="205" width="280" height="105" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="760" y="221" width="5" height="73" fill="#b94343"/><text x="780" y="240" fill="#b94343" font-size="23" font-weight="700">FIFO: B · C · D</text><text x="780" y="271" fill="#506879" font-size="18" font-weight="400">Вытеснен A</text><rect x="40" y="390" width="280" height="105" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="40" y="406" width="5" height="73" fill="#087e80"/><text x="60" y="425" fill="#087e80" font-size="23" font-weight="700">LRU: A · B · C</text><rect x="390" y="390" width="280" height="105" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="390" y="406" width="5" height="73" fill="#087e80"/><text x="410" y="425" fill="#087e80" font-size="23" font-weight="700">LRU: B · C · A</text><rect x="760" y="390" width="280" height="105" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="760" y="406" width="5" height="73" fill="#ac7919"/><text x="780" y="425" fill="#ac7919" font-size="23" font-weight="700">LRU: C · A · D</text><text x="780" y="456" fill="#506879" font-size="18" font-weight="400">Вытеснен B</text><polyline points="320,260 390,260" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="670,260 760,260" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="320,445 390,445" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="670,445 760,445" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="40" y="560" fill="#172f40" font-size="23" font-weight="600">FIFO обновляет очередь при вставке; LRU — также при попадании.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>