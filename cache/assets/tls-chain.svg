<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Доверие в TLS и mTLS</title><desc id="desc">Клиент доверяет CA и проверяет SAN сервера. При mTLS сервер проверяет сертификат клиента. Это не автоматическое разрешение всех команд.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Доверие в TLS и mTLS</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">CA, имя сервера и прикладные полномочия — отдельные проверки</text><rect x="380" y="145" width="340" height="115" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="380" y="161" width="5" height="83" fill="#ac7919"/><text x="400" y="180" fill="#ac7919" font-size="23" font-weight="700">Учебный CA</text><text x="400" y="211" fill="#506879" font-size="18" font-weight="400">Подписывает сертификаты</text><rect x="70" y="375" width="380" height="150" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="70" y="391" width="5" height="118" fill="#405fb1"/><text x="90" y="410" fill="#405fb1" font-size="23" font-weight="700">Клиент</text><text x="90" y="441" fill="#506879" font-size="18" font-weight="400">Проверяет CA + SAN сервера</text><text x="90" y="468" fill="#506879" font-size="18" font-weight="400">Предъявляет свой сертификат</text><rect x="650" y="375" width="380" height="150" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="650" y="391" width="5" height="118" fill="#087e80"/><text x="670" y="410" fill="#087e80" font-size="23" font-weight="700">Сервер</text><text x="670" y="441" fill="#506879" font-size="18" font-weight="400">Проверяет сертификат клиента</text><text x="670" y="468" fill="#506879" font-size="18" font-weight="400">Затем выполняет AUTH / ACL</text><rect x="975" y="393" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1002" cy="398" r="2" fill="#087e80"/><rect x="975" y="408" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1002" cy="413" r="2" fill="#087e80"/><rect x="975" y="423" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1002" cy="428" r="2" fill="#087e80"/><polyline points="440,260 260,375" fill="none" stroke="#ac7919" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="90" y="310" fill="#ac7919" font-size="18" font-weight="600">сертификат клиента</text><polyline points="660,260 840,375" fill="none" stroke="#ac7919" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="765" y="310" fill="#ac7919" font-size="18" font-weight="600">сертификат сервера</text><polyline points="450,445 650,445" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="520" y="425" fill="#087e80" font-size="18" font-weight="600">TLS</text><text x="70" y="580" fill="#172f40" font-size="23" font-weight="600">Закрытый ключ CA не требуется для обычного подключения.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>