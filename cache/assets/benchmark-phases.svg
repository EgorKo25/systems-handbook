<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Четыре обязательных режима опыта</title><desc id="desc">Прогретый результат сравнивают с исходной системой, а решение принимают с учётом холодного старта и отказа. На каждом режиме проверяют ограничения источника и корректность возвращённых данных.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Четыре обязательных режима опыта</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Максимум операций в секунду не заменяет проверку целевого поведения</text><rect x="35" y="190" width="245" height="185" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="35" y="206" width="5" height="153" fill="#405fb1"/><text x="55" y="225" fill="#405fb1" font-size="23" font-weight="700">Без кэша</text><text x="55" y="256" fill="#506879" font-size="18" font-weight="400">Исправленный источник</text><text x="55" y="283" fill="#506879" font-size="18" font-weight="400">SLO и исходная цена</text><polyline points="280,280 305,280" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="305" y="190" width="245" height="185" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="305" y="206" width="5" height="153" fill="#ac7919"/><text x="325" y="225" fill="#ac7919" font-size="23" font-weight="700">Холодный кэш</text><text x="325" y="256" fill="#506879" font-size="18" font-weight="400">Ограниченный прогрев</text><text x="325" y="283" fill="#506879" font-size="18" font-weight="400">Пик чтений источника</text><polyline points="550,280 575,280" fill="none" stroke="#ac7919" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="575" y="190" width="245" height="185" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="575" y="206" width="5" height="153" fill="#087e80"/><text x="595" y="225" fill="#087e80" font-size="23" font-weight="700">Прогретый кэш</text><text x="595" y="256" fill="#506879" font-size="18" font-weight="400">Попадания и промахи</text><text x="595" y="283" fill="#506879" font-size="18" font-weight="400">Свежесть и ресурсы</text><polyline points="820,280 845,280" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="845" y="190" width="245" height="185" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="845" y="206" width="5" height="153" fill="#b94343"/><text x="865" y="225" fill="#b94343" font-size="23" font-weight="700">Отказ кэша</text><text x="865" y="256" fill="#506879" font-size="18" font-weight="400">Тайм-ауты и обход</text><text x="865" y="283" fill="#506879" font-size="18" font-weight="400">Защита источника</text><rect x="80" y="445" width="940" height="110" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="80" y="461" width="5" height="78" fill="#405fb1"/><text x="100" y="480" fill="#405fb1" font-size="23" font-weight="700">Для каждой фазы: правильность ответа → SLO → ресурсы → устойчивость</text><text x="100" y="511" fill="#506879" font-size="18" font-weight="400">Генератор и метод измерения одинаковы; незавершённые запросы входят в отчёт.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>