<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Устройство экземпляра Redis</title><desc id="desc">Сохранение и репликация — отдельные контуры. Успешное исполнение команды не означает автоматически, что оба завершены.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Устройство экземпляра Redis</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Командный путь, оперативная память и дополнительные контуры</text><rect x="40" y="180" width="250" height="150" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="196" width="5" height="118" fill="#405fb1"/><text x="60" y="215" fill="#405fb1" font-size="23" font-weight="700">Приложение</text><text x="60" y="246" fill="#506879" font-size="18" font-weight="400">Пул соединений</text><text x="60" y="273" fill="#506879" font-size="18" font-weight="400">RESP / TLS</text><rect x="390" y="160" width="310" height="200" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="390" y="176" width="5" height="168" fill="#b94343"/><text x="410" y="195" fill="#b94343" font-size="23" font-weight="700">Redis</text><text x="410" y="226" fill="#506879" font-size="18" font-weight="400">Проверка ACL</text><text x="410" y="253" fill="#506879" font-size="18" font-weight="400">Исполнение команд</text><text x="410" y="280" fill="#506879" font-size="18" font-weight="400">Структуры в RAM</text><rect x="645" y="178" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="672" cy="183" r="2" fill="#b94343"/><rect x="645" y="193" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="672" cy="198" r="2" fill="#b94343"/><rect x="645" y="208" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="672" cy="213" r="2" fill="#b94343"/><rect x="800" y="155" width="250" height="140" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="800" y="171" width="5" height="108" fill="#087e80"/><text x="820" y="190" fill="#087e80" font-size="23" font-weight="700">Реплика</text><text x="820" y="221" fill="#506879" font-size="18" font-weight="400">Копия данных</text><text x="820" y="248" fill="#506879" font-size="18" font-weight="400">Поток изменений</text><rect x="995" y="173" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1022" cy="178" r="2" fill="#087e80"/><rect x="995" y="188" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1022" cy="193" r="2" fill="#087e80"/><rect x="995" y="203" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1022" cy="208" r="2" fill="#087e80"/><rect x="390" y="455" width="310" height="115" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="390" y="471" width="5" height="83" fill="#ac7919"/><text x="410" y="490" fill="#ac7919" font-size="23" font-weight="700">RDB / AOF</text><text x="410" y="521" fill="#506879" font-size="18" font-weight="400">Сохранение и восстановление</text><polyline points="290,250 390,250" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="300" y="230" fill="#405fb1" font-size="18" font-weight="600">команда</text><polyline points="700,225 800,225" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="710" y="205" fill="#087e80" font-size="18" font-weight="600">поток</text><polyline points="545,360 545,455" fill="none" stroke="#ac7919" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="565" y="405" fill="#ac7919" font-size="18" font-weight="600">по конфигурации</text><text x="45" y="490" fill="#172f40" font-size="23" font-weight="700">GET из памяти включает</text><text x="45" y="525" fill="#506879" font-size="20" font-weight="400">сеть, разбор и исполнение.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>