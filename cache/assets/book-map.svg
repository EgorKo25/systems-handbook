<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Три самостоятельные части</title><desc id="desc">Теория объясняется независимо от продуктов. Затем каждый продукт изучается последовательно, со своей моделью доступа и распределения данных.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Три самостоятельные части</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Общие принципы → реализация → проверяемая эксплуатация</text><rect x="40" y="170" width="310" height="280" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="186" width="5" height="248" fill="#405fb1"/><text x="60" y="205" fill="#405fb1" font-size="23" font-weight="700">КЭШИРОВАНИЕ</text><text x="60" y="236" fill="#506879" font-size="18" font-weight="400">Локальность и рабочий набор</text><text x="60" y="263" fill="#506879" font-size="18" font-weight="400">Поиск и размещение</text><text x="60" y="290" fill="#506879" font-size="18" font-weight="400">Допуск и вытеснение</text><text x="60" y="317" fill="#506879" font-size="18" font-weight="400">Свежесть и инвалидация</text><text x="60" y="344" fill="#506879" font-size="18" font-weight="400">Расчёт эффекта</text><rect x="395" y="170" width="310" height="280" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="395" y="186" width="5" height="248" fill="#b94343"/><text x="415" y="205" fill="#b94343" font-size="23" font-weight="700">REDIS</text><text x="415" y="236" fill="#506879" font-size="18" font-weight="400">Структуры и команды</text><text x="415" y="263" fill="#506879" font-size="18" font-weight="400">ACL и защищённый канал</text><text x="415" y="290" fill="#506879" font-size="18" font-weight="400">RDB / AOF</text><text x="415" y="317" fill="#506879" font-size="18" font-weight="400">Репликация и Sentinel</text><text x="415" y="344" fill="#506879" font-size="18" font-weight="400">Cluster: слоты и узлы</text><rect x="650" y="188" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="677" cy="193" r="2" fill="#b94343"/><rect x="650" y="203" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="677" cy="208" r="2" fill="#b94343"/><rect x="650" y="218" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="677" cy="223" r="2" fill="#b94343"/><rect x="750" y="170" width="310" height="280" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="750" y="186" width="5" height="248" fill="#087e80"/><text x="770" y="205" fill="#087e80" font-size="23" font-weight="700">MEMCACHED</text><text x="770" y="236" fill="#506879" font-size="18" font-weight="400">Байтовые значения</text><text x="770" y="263" fill="#506879" font-size="18" font-weight="400">Slab-классы и LRU</text><text x="770" y="290" fill="#506879" font-size="18" font-weight="400">TLS / SASL</text><text x="770" y="317" fill="#506879" font-size="18" font-weight="400">Клиентское распределение</text><text x="770" y="344" fill="#506879" font-size="18" font-weight="400">Прокси и обслуживание</text><rect x="1005" y="188" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1032" cy="193" r="2" fill="#087e80"/><rect x="1005" y="203" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1032" cy="208" r="2" fill="#087e80"/><rect x="1005" y="218" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1032" cy="223" r="2" fill="#087e80"/><rect x="180" y="500" width="740" height="70" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="180" y="516" width="5" height="38" fill="#405fb1"/><text x="200" y="535" fill="#405fb1" font-size="23" font-weight="700">Для каждой темы: модель → пример → измерение → отказ</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>