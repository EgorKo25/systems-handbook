<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">TTL и возраст состояния источника</title><desc id="desc">Без инвалидации изменение источника в t=10 не меняет копию. До t=60 она может быть найдена, хотя уже отстаёт от источника.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">TTL и возраст состояния источника</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Фиксированный срок 60 с начинается при заполнении копии</text><polyline points="80,250 1020,250" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="80,450 1020,450" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="40" y="185" fill="#405fb1" font-size="25" font-weight="700">Источник</text><text x="40" y="385" fill="#087e80" font-size="25" font-weight="700">Кэш</text><text x="80" y="225" fill="#405fb1" font-size="22" font-weight="400">t=0: v7</text><text x="300" y="225" fill="#b94343" font-size="22" font-weight="400">t=10: COMMIT v8</text><text x="820" y="225" fill="#405fb1" font-size="22" font-weight="400">t=60: v8</text><rect x="310" y="410" width="570" height="75" rx="8" fill="#b94343" opacity=".12"/><text x="80" y="425" fill="#087e80" font-size="22" font-weight="400">v7</text><text x="365" y="440" fill="#b94343" font-size="23" font-weight="600">Старая копия v7 остаётся доступной</text><text x="820" y="520" fill="#ac7919" font-size="21" font-weight="400">истечение</text><path d="M310 230 V490 M880 230 V490" stroke="#a5b7c3" stroke-width="2" stroke-dasharray="6 5"/><text x="40" y="570" fill="#172f40" font-size="23" font-weight="600">TTL сам по себе не доставляет событие изменения источника.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>