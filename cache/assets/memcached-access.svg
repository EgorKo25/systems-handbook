<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Доступ к Memcached</title><desc id="desc">TLS и SASL проверяют разные аспекты подключения. Для недоверяющих арендаторов нельзя считать префиксы автоматическим разграничением прав.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Доступ к Memcached</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Аутентификация соединения не равна ACL на префиксы</text><rect x="40" y="180" width="310" height="170" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="196" width="5" height="138" fill="#405fb1"/><text x="60" y="215" fill="#405fb1" font-size="23" font-weight="700">Приложение</text><text x="60" y="246" fill="#506879" font-size="18" font-weight="400">TLS-клиент или SASL</text><text x="60" y="273" fill="#506879" font-size="18" font-weight="400">Проверка сервера</text><text x="60" y="300" fill="#506879" font-size="18" font-weight="400">Совместимый протокол</text><rect x="440" y="180" width="310" height="170" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="440" y="196" width="5" height="138" fill="#087e80"/><text x="460" y="215" fill="#087e80" font-size="23" font-weight="700">Memcached</text><text x="460" y="246" fill="#506879" font-size="18" font-weight="400">Допуск соединения</text><text x="460" y="273" fill="#506879" font-size="18" font-weight="400">Операции с ключами</text><text x="460" y="300" fill="#506879" font-size="18" font-weight="400">Общий набор данных</text><rect x="695" y="198" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="722" cy="203" r="2" fill="#087e80"/><rect x="695" y="213" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="722" cy="218" r="2" fill="#087e80"/><rect x="695" y="228" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="722" cy="233" r="2" fill="#087e80"/><polyline points="350,265 440,265" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="800" y="180" width="250" height="170" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="800" y="196" width="5" height="138" fill="#b94343"/><text x="820" y="215" fill="#b94343" font-size="23" font-weight="700">Другой контур</text><text x="820" y="246" fill="#506879" font-size="18" font-weight="400">Отдельный экземпляр</text><text x="820" y="273" fill="#506879" font-size="18" font-weight="400">при необходимости</text><text x="820" y="300" fill="#506879" font-size="18" font-weight="400">изоляции</text><rect x="995" y="198" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1022" cy="203" r="2" fill="#b94343"/><rect x="995" y="213" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1022" cy="218" r="2" fill="#b94343"/><rect x="995" y="228" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1022" cy="233" r="2" fill="#b94343"/><rect x="100" y="460" width="900" height="100" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="100" y="476" width="5" height="68" fill="#b94343"/><text x="120" y="495" fill="#b94343" font-size="23" font-weight="700">tenantA: и tenantB:</text><text x="120" y="526" fill="#506879" font-size="18" font-weight="400">Префикс без механизма контроля остаётся соглашением приложения.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>