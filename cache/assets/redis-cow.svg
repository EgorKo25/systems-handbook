<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Redis: copy-on-write во время снимка</title><desc id="desc">fork не копирует сразу весь набор. В модели четыре страницы после двух разных изменений требуют ещё две физические копии. RDB сериализует объекты снимка, а не сохраняет физические страницы как дамп памяти. Реальные расходы включают таблицы страниц, аллокатор и буферы; RSS основного и потомка нельзя просто сложить как независимые наборы.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Redis: copy-on-write во время снимка</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Условные страницы P0…P3; на рисунке изменены ровно две страницы</text><text x="40" y="150" fill="#405fb1" font-size="24" font-weight="700">1. После fork</text><text x="405" y="150" fill="#b94343" font-size="23" font-weight="700">2. Основной меняет P1 и P3</text><text x="790" y="150" fill="#087e80" font-size="23" font-weight="700">3. Снимок завершён</text><rect x="40" y="180" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="196" width="5" height="26" fill="#405fb1"/><text x="60" y="215" fill="#405fb1" font-size="23" font-weight="700">P0: версия 7</text><rect x="40" y="252" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="268" width="5" height="26" fill="#405fb1"/><text x="60" y="287" fill="#405fb1" font-size="23" font-weight="700">P1: версия 7</text><rect x="40" y="324" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="340" width="5" height="26" fill="#405fb1"/><text x="60" y="359" fill="#405fb1" font-size="23" font-weight="700">P2: версия 7</text><rect x="40" y="396" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="412" width="5" height="26" fill="#405fb1"/><text x="60" y="431" fill="#405fb1" font-size="23" font-weight="700">P3: версия 7</text><text x="40" y="505" fill="#506879" font-size="17" font-weight="400">4 общие физические страницы</text><text x="40" y="540" fill="#506879" font-size="17" font-weight="400">Основной и потомок читают v7</text><rect x="415" y="180" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="415" y="196" width="5" height="26" fill="#405fb1"/><text x="435" y="215" fill="#405fb1" font-size="23" font-weight="700">P0: v7 · для снимка</text><rect x="415" y="252" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="415" y="268" width="5" height="26" fill="#405fb1"/><text x="435" y="287" fill="#405fb1" font-size="23" font-weight="700">P1: v7 · для снимка</text><rect x="415" y="324" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="415" y="340" width="5" height="26" fill="#405fb1"/><text x="435" y="359" fill="#405fb1" font-size="23" font-weight="700">P2: v7 · для снимка</text><rect x="415" y="396" width="280" height="58" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="415" y="412" width="5" height="26" fill="#405fb1"/><text x="435" y="431" fill="#405fb1" font-size="23" font-weight="700">P3: v7 · для снимка</text><text x="415" y="505" fill="#b94343" font-size="18" font-weight="600">+ P1′ v8 и P3′ v8 основного</text><text x="415" y="540" fill="#506879" font-size="17" font-weight="400">6 страниц: 4 исходные + 2 копии</text><rect x="790" y="180" width="270" height="58" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="790" y="196" width="5" height="26" fill="#087e80"/><text x="810" y="215" fill="#087e80" font-size="23" font-weight="700">Из P0: данные v7</text><rect x="790" y="252" width="270" height="58" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="790" y="268" width="5" height="26" fill="#087e80"/><text x="810" y="287" fill="#087e80" font-size="23" font-weight="700">Из P1: данные v7</text><rect x="790" y="324" width="270" height="58" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="790" y="340" width="5" height="26" fill="#087e80"/><text x="810" y="359" fill="#087e80" font-size="23" font-weight="700">Из P2: данные v7</text><rect x="790" y="396" width="270" height="58" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="790" y="412" width="5" height="26" fill="#087e80"/><text x="810" y="431" fill="#087e80" font-size="23" font-weight="700">Из P3: данные v7</text><text x="790" y="505" fill="#b94343" font-size="18" font-weight="600">Основной продолжает с v8</text><text x="790" y="540" fill="#506879" font-size="16" font-weight="400">RDB: объекты, не дамп страниц</text><text x="40" y="585" fill="#172f40" font-size="17" font-weight="400">Копируются затронутые страницы памяти. Два изменённых ключа могут затронуть больше двух страниц.</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>