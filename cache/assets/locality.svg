<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Локальность обращений</title><desc id="desc">В верхней трассе небольшой набор часто повторяется. В нижней каждый ключ встречается один раз; обычное заполнение не создаёт попаданий.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Локальность обращений</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Одинаковое количество запросов — разная возможность повторного использования</text><text x="40" y="200" fill="#172f40" font-size="25" font-weight="700">Повторяемый набор</text><rect x="40" y="225" width="68" height="66" rx="10" fill="#087e80" opacity=".15"/><text x="61" y="268" fill="#087e80" font-size="30" font-weight="700">A</text><rect x="124" y="225" width="68" height="66" rx="10" fill="#405fb1" opacity=".15"/><text x="145" y="268" fill="#405fb1" font-size="30" font-weight="700">B</text><rect x="208" y="225" width="68" height="66" rx="10" fill="#087e80" opacity=".15"/><text x="229" y="268" fill="#087e80" font-size="30" font-weight="700">A</text><rect x="292" y="225" width="68" height="66" rx="10" fill="#ac7919" opacity=".15"/><text x="313" y="268" fill="#ac7919" font-size="30" font-weight="700">C</text><rect x="376" y="225" width="68" height="66" rx="10" fill="#087e80" opacity=".15"/><text x="397" y="268" fill="#087e80" font-size="30" font-weight="700">A</text><rect x="460" y="225" width="68" height="66" rx="10" fill="#405fb1" opacity=".15"/><text x="481" y="268" fill="#405fb1" font-size="30" font-weight="700">B</text><rect x="544" y="225" width="68" height="66" rx="10" fill="#087e80" opacity=".15"/><text x="565" y="268" fill="#087e80" font-size="30" font-weight="700">A</text><rect x="628" y="225" width="68" height="66" rx="10" fill="#506879" opacity=".15"/><text x="649" y="268" fill="#506879" font-size="30" font-weight="700">D</text><rect x="712" y="225" width="68" height="66" rx="10" fill="#087e80" opacity=".15"/><text x="733" y="268" fill="#087e80" font-size="30" font-weight="700">A</text><rect x="796" y="225" width="68" height="66" rx="10" fill="#405fb1" opacity=".15"/><text x="817" y="268" fill="#405fb1" font-size="30" font-weight="700">B</text><rect x="880" y="225" width="68" height="66" rx="10" fill="#087e80" opacity=".15"/><text x="901" y="268" fill="#087e80" font-size="30" font-weight="700">A</text><rect x="964" y="225" width="68" height="66" rx="10" fill="#ac7919" opacity=".15"/><text x="985" y="268" fill="#ac7919" font-size="30" font-weight="700">C</text><text x="40" y="380" fill="#172f40" font-size="25" font-weight="700">Однократный проход</text><rect x="40" y="405" width="68" height="66" rx="10" fill="#087e80" opacity=".15"/><text x="61" y="448" fill="#087e80" font-size="30" font-weight="700">A</text><rect x="124" y="405" width="68" height="66" rx="10" fill="#405fb1" opacity=".15"/><text x="145" y="448" fill="#405fb1" font-size="30" font-weight="700">B</text><rect x="208" y="405" width="68" height="66" rx="10" fill="#ac7919" opacity=".15"/><text x="229" y="448" fill="#ac7919" font-size="30" font-weight="700">C</text><rect x="292" y="405" width="68" height="66" rx="10" fill="#506879" opacity=".15"/><text x="313" y="448" fill="#506879" font-size="30" font-weight="700">D</text><rect x="376" y="405" width="68" height="66" rx="10" fill="#506879" opacity=".15"/><text x="397" y="448" fill="#506879" font-size="30" font-weight="700">E</text><rect x="460" y="405" width="68" height="66" rx="10" fill="#50