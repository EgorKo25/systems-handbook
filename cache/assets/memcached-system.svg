<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Устройство экземпляра Memcached</title><desc id="desc">Обычный Memcached не загружает данные источника сам. Срок и вытеснение могут удалить запись независимо от готовности приложения.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Устройство экземпляра Memcached</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Приложение определяет смысл значения и восстанавливает промах</text><rect x="40" y="180" width="270" height="170" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="196" width="5" height="138" fill="#405fb1"/><text x="60" y="215" fill="#405fb1" font-size="23" font-weight="700">Приложение</text><text x="60" y="246" fill="#506879" font-size="18" font-weight="400">Ключ и сериализация</text><text x="60" y="273" fill="#506879" font-size="18" font-weight="400">Выбор сервера</text><text x="60" y="300" fill="#506879" font-size="18" font-weight="400">Заполнение при промахе</text><rect x="420" y="160" width="300" height="210" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="420" y="176" width="5" height="178" fill="#087e80"/><text x="440" y="195" fill="#087e80" font-size="23" font-weight="700">Memcached</text><text x="440" y="226" fill="#506879" font-size="18" font-weight="400">Разбор протокола</text><text x="440" y="253" fill="#506879" font-size="18" font-weight="400">Поиск ключа</text><text x="440" y="280" fill="#506879" font-size="18" font-weight="400">Память: slab + LRU</text><rect x="665" y="178" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="692" cy="183" r="2" fill="#087e80"/><rect x="665" y="193" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="692" cy="198" r="2" fill="#087e80"/><rect x="665" y="208" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="692" cy="213" r="2" fill="#087e80"/><rect x="420" y="460" width="300" height="105" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="420" y="476" width="5" height="73" fill="#ac7919"/><text x="440" y="495" fill="#ac7919" font-size="23" font-weight="700">Источник данных</text><text x="440" y="526" fill="#506879" font-size="18" font-weight="400">SQL / API / вычисление</text><polyline points="310,245 420,245" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="320" y="225" fill="#405fb1" font-size="18" font-weight="600">get / set</text><polyline points="170,350 170,510 420,510" fill="none" stroke="#ac7919" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="195" y="490" fill="#ac7919" font-size="18" font-weight="600">при промахе</text><rect x="810" y="175" width="240" height="185" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="810" y="191" width="5" height="153" fill="#b94343"/><text x="830" y="210" fill="#b94343" font-size="23" font-weight="700">Границы</text><text x="830" y="241" fill="#506879" font-size="18" font-weight="400">Нет SQL-загрузчика</text><text x="830" y="268" fill="#506879" font-size="18" font-weight="400">Нет общего ACL</text><text x="830" y="295" fill="#506879" font-size="18" font-weight="400">Ключи могут исчезать</text><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>