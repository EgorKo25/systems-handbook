<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Клиентское распределение Memcached</title><desc id="desc">Клиент выбирает один backend. Между серверами не показаны стрелки репликации, поскольку обычная конфигурация её не создаёт.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Клиентское распределение Memcached</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Маршрутизация находится вне обычных серверов хранения</text><rect x="375" y="145" width="350" height="120" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="375" y="161" width="5" height="88" fill="#405fb1"/><text x="395" y="180" fill="#405fb1" font-size="23" font-weight="700">Клиентская библиотека</text><text x="395" y="211" fill="#506879" font-size="18" font-weight="400">key + список узлов → владелец</text><rect x="40" y="405" width="290" height="135" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="40" y="421" width="5" height="103" fill="#087e80"/><text x="60" y="440" fill="#087e80" font-size="23" font-weight="700">Memcached 1</text><text x="60" y="471" fill="#506879" font-size="18" font-weight="400">Своя часть ключей</text><text x="60" y="498" fill="#506879" font-size="18" font-weight="400">Нет обмена с соседями</text><rect x="275" y="423" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="302" cy="428" r="2" fill="#087e80"/><rect x="275" y="438" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="302" cy="443" r="2" fill="#087e80"/><rect x="275" y="453" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="302" cy="458" r="2" fill="#087e80"/><polyline points="550,265 550,330 185,330 185,405" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="405" y="405" width="290" height="135" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="405" y="421" width="5" height="103" fill="#405fb1"/><text x="425" y="440" fill="#405fb1" font-size="23" font-weight="700">Memcached 2</text><text x="425" y="471" fill="#506879" font-size="18" font-weight="400">Своя часть ключей</text><text x="425" y="498" fill="#506879" font-size="18" font-weight="400">Нет обмена с соседями</text><rect x="640" y="423" width="34" height="10" rx="3" fill="#405fb1" opacity=".20"/><circle cx="667" cy="428" r="2" fill="#405fb1"/><rect x="640" y="438" width="34" height="10" rx="3" fill="#405fb1" opacity=".20"/><circle cx="667" cy="443" r="2" fill="#405fb1"/><rect x="640" y="453" width="34" height="10" rx="3" fill="#405fb1" opacity=".20"/><circle cx="667" cy="458" r="2" fill="#405fb1"/><polyline points="550,265 550,330 550,330 550,405" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="770" y="405" width="290" height="135" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="770" y="421" width="5" height="103" fill="#b94343"/><text x="790" y="440" fill="#b94343" font-size="23" font-weight="700">Memcached 3</text><text x="790" y="471" fill="#506879" font-size="18" font-weight="400">Своя часть ключей</text><text x="790" y="498" fill="#506879" font-size="18" font-weight="400">Нет обмена с соседями</text><rect x="1005" y="423" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1032" cy="428" r="2" fill="#b94343"/><rect x="1005" y="438" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1032" cy="443" r="2" fill="#b94343"/><rect x="1005" y="453" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1032" cy="458" r="2" fill="#b94343"/><polyline points="550,265 550,330 915,330 915,405" fill="none" stroke="#b94343" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>