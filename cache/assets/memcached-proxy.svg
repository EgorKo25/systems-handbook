<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Маршрутизация через прокси</title><desc id="desc">Прокси добавляет собственный путь обработки и отказ. Успешная защита клиентского канала не гарантирует защиту канала к backend.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="context-stroke"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8e1e7"/></pattern></defs><rect width="1100" height="650" rx="24" fill="#f3f7f8"/><rect x="20" y="125" width="1060" height="485" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="55" fill="#172f40" font-size="32" font-weight="700">Маршрутизация через прокси</text><text x="38" y="91" fill="#506879" font-size="19" font-weight="400">Входной и внутренний каналы имеют отдельные ресурсы и защиту</text><rect x="40" y="260" width="250" height="130" rx="16" fill="#ffffff" stroke="#405fb1" stroke-width="2"/><rect x="40" y="276" width="5" height="98" fill="#405fb1"/><text x="60" y="295" fill="#405fb1" font-size="23" font-weight="700">Приложение</text><text x="60" y="326" fill="#506879" font-size="18" font-weight="400">Endpoint прокси</text><rect x="405" y="230" width="290" height="190" rx="16" fill="#ffffff" stroke="#ac7919" stroke-width="2"/><rect x="405" y="246" width="5" height="158" fill="#ac7919"/><text x="425" y="265" fill="#ac7919" font-size="23" font-weight="700">Proxy</text><text x="425" y="296" fill="#506879" font-size="18" font-weight="400">Правила маршрутов</text><text x="425" y="323" fill="#506879" font-size="18" font-weight="400">Пулы backend</text><text x="425" y="350" fill="#506879" font-size="18" font-weight="400">Тайм-ауты и буферы</text><rect x="640" y="248" width="34" height="10" rx="3" fill="#ac7919" opacity=".20"/><circle cx="667" cy="253" r="2" fill="#ac7919"/><rect x="640" y="263" width="34" height="10" rx="3" fill="#ac7919" opacity=".20"/><circle cx="667" cy="268" r="2" fill="#ac7919"/><rect x="640" y="278" width="34" height="10" rx="3" fill="#ac7919" opacity=".20"/><circle cx="667" cy="283" r="2" fill="#ac7919"/><rect x="805" y="150" width="250" height="125" rx="16" fill="#ffffff" stroke="#087e80" stroke-width="2"/><rect x="805" y="166" width="5" height="93" fill="#087e80"/><text x="825" y="185" fill="#087e80" font-size="23" font-weight="700">Backend A</text><text x="825" y="216" fill="#506879" font-size="18" font-weight="400">Часть ключей</text><rect x="1000" y="168" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1027" cy="173" r="2" fill="#087e80"/><rect x="1000" y="183" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1027" cy="188" r="2" fill="#087e80"/><rect x="1000" y="198" width="34" height="10" rx="3" fill="#087e80" opacity=".20"/><circle cx="1027" cy="203" r="2" fill="#087e80"/><rect x="805" y="455" width="250" height="125" rx="16" fill="#ffffff" stroke="#b94343" stroke-width="2"/><rect x="805" y="471" width="5" height="93" fill="#b94343"/><text x="825" y="490" fill="#b94343" font-size="23" font-weight="700">Backend B</text><text x="825" y="521" fill="#506879" font-size="18" font-weight="400">Часть ключей</text><rect x="1000" y="473" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1027" cy="478" r="2" fill="#b94343"/><rect x="1000" y="488" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1027" cy="493" r="2" fill="#b94343"/><rect x="1000" y="503" width="34" height="10" rx="3" fill="#b94343" opacity=".20"/><circle cx="1027" cy="508" r="2" fill="#b94343"/><polyline points="290,325 405,325" fill="none" stroke="#405fb1" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="695,280 750,280 750,210 805,210" fill="none" stroke="#087e80" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><polyline points="695,370 750,370 750,515 805,515" fill="none" stroke="#b94343" stroke-width="3" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="38" y="625" fill="#506879" font-size="16" font-weight="400">Том V · учебная схема · связи и размеры показаны условно</text></g></svg>