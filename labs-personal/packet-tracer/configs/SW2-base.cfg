enable
configure terminal
hostname SW2
no ip domain-lookup
vlan 10
 name CLIENTS
vlan 20
 name SERVICES_TEST
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20 root secondary
interface FastEthernet0/1
