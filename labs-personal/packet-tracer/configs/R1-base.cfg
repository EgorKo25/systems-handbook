enable
configure terminal
hostname R1
no ip domain-lookup
interface GigabitEthernet0/0
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.44.10.1 255.255.255.0
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.44.20.1 255.255.255.0
interface GigabitEthernet0/1
 description TRANSIT_A_TO_R2_G0_1
 ip address 10.44.250.1 255.255.255.252
 ip ospf cost 10
 no shutdown
interface GigabitEthernet0/2
 description TRANSIT_B_TO_R2_G0_2
 ip address 10.44.250.5 255.255.255.252
 ip ospf cost 20
 no shutdown
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 network 10.44.10.0 0.0.0.255 area 0
 network 10.44.20.0 0.0.0.255 area 0
 network 10.44.250.0 0.0.0.3 area 0
 network 10.44.250.4 0.0.0.3 area 0
end
copy running-config startup-config
