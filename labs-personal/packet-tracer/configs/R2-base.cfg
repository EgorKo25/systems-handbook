enable
configure terminal
hostname R2
no ip domain-lookup
interface GigabitEthernet0/0
 description SERVER_LAN_TO_SW3
 ip address 10.44.30.1 255.255.255.0
 no shutdown
interface GigabitEthernet0/1
 description TRANSIT_A_TO_R1_G0_1
 ip address 10.44.250.2 255.255.255.252
 ip ospf cost 10
 no shutdown
interface GigabitEthernet0/2
 description TRANSIT_B_TO_R1_G0_2
 ip address 10.44.250.6 255.255.255.252
 ip ospf cost 20
 no shutdown
router ospf 1
 router-id 2.2.2.2
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 network 10.44.30.0 0.0.0.255 area 0
 network 10.44.250.0 0.0.0.3 area 0
 network 10.44.250.4 0.0.0.3 area 0
end
copy running-config startup-config
